services:
  - type: web
    name: zeroday-security-ai-backend
    runtime: python
    region: singapore  # closest to India
    plan: free         # upgrade to starter ($7/mo) for always-on
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: ALLOWED_ORIGINS
        sync: false
      # ── Database ──────────────────────────────────────────────
      # IMPORTANT: Set DATABASE_URL manually in Render dashboard to your
      # Postgres Internal Database URL. SQLite will be wiped on free-tier restarts.
      - key: DATABASE_URL
        sync: false   # set manually in Render dashboard — never commit
      # ── Auth ──────────────────────────────────────────────────
      # IMPORTANT: Set JWT_SECRET_KEY manually in Render dashboard to a fixed
      # 64-char hex secret (run: openssl rand -hex 32).
      # DO NOT use generateValue — it rotates the secret on every deploy and
      # invalidates all existing login sessions.
      - key: JWT_SECRET_KEY
        sync: false   # set manually in Render dashboard — use openssl rand -hex 32
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: REFRESH_TOKEN_EXPIRE_MINUTES
        value: "10080"
      # ── LLM Provider ──────────────────────────────────────────
      - key: LLM_PROVIDER
        sync: false   # set in Render dashboard: groq | nvidia | gemini | anthropic
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: NVIDIA_API_KEY
        sync: false
      - key: NVIDIA_MODEL
        value: nvidia/llama-3.1-nemotron-ultra-253b-v1
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-1.5-flash-latest
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-4-6
      - key: NVD_API_KEY
        sync: false
